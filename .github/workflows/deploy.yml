name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
      DISABLE_REGISTER: ${{ secrets.DISABLE_REGISTER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AUTH_SECRET AUTH_GITHUB_ID AUTH_GITHUB_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets present."

      - name: Resolve Worker and D1 names
        run: |
          # Empty repo secrets fall back to production defaults (Worker/D1 name `moepush`).
          if [ -n "${{ secrets.D1_DATABASE_NAME }}" ]; then
            echo "D1_DATABASE_NAME=${{ secrets.D1_DATABASE_NAME }}" >> "$GITHUB_ENV"
          else
            echo "D1_DATABASE_NAME=moepush" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.PROJECT_NAME }}" ]; then
            echo "PROJECT_NAME=${{ secrets.PROJECT_NAME }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT_NAME=moepush" >> "$GITHUB_ENV"
          fi
          echo "Worker and D1 names written to GITHUB_ENV for deploy step."

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build (Next.js)
        run: pnpm exec next build

      - name: Deploy via scripts/deploy.ts
        run: pnpm dlx tsx scripts/deploy.ts
